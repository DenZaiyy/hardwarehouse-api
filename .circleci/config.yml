version: 2.1
commands:
  npm-ci:
    description: Install npm dependencies using npm ci
    steps:
      - node/install-packages:
          pkg-manager: npm
          cache-version: v1
          override-ci-command: npm ci
      - persist_to_workspace:
          root: .
          paths:
            - node_modules
  attach-workspace:
    description: Attach workspace with node_modules
    steps:
      - attach_workspace:
          at: .
orbs:
  node: circleci/node@7.1.0 # Node.js orb for CircleCI
  lighthouse-check: foo-software/lighthouse-check@0.0.13
executors:
  # Même version de Node.js que le VPS de production (v24.13.0, relevée le 27 octobre 2026) : la version construite
  # par la CI y tourne telle quelle. Grande machine par défaut, comme l'exécuteur de l'orbe qu'il remplace.
  node-prod:
    docker:
      - image: cimg/node:24.13.0
    resource_class: large
jobs:
  install-dependencies:
    executor: node-prod
    resource_class: small
    steps:
      - checkout
      - npm-ci

  # Job to run tests with jest-junit and store results to /test-results
  test-node:
    # Install node dependencies and run tests
    executor: node-prod
    resource_class: medium
    parallelism: 4
    environment:
      JEST_JUNIT_OUTPUT_DIR: ./test-results/
    # Define the steps to run in this job
    steps:
      - checkout
      - attach-workspace  # Use cached node_modules
      - run:
          name: Generate Prisma Client
          command: npx prisma generate
      - run:
          name: Create test-results directory
          command: mkdir -p ./test-results
        # Run the tests using npm and generate test results
      - run:
          name: Run tests
          command: npm run test -- --ci --runInBand --reporters=default --reporters=jest-junit
      # Store the test results in the specified directory
      - store_test_results:
          path: ./test-results/

  # Job to audit the node project
  audit-node:
    executor: node-prod
    # Define the steps to run in this job
    steps:
      - checkout
      - attach-workspace  # Use cached node_modules
      # Install JQ for audit
      - run:
          name: Install jq
          command: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq
      # Run npm audit on the production dependencies: those shipped with the API. Development tooling
      # (ESLint, Jest) can carry advisories without a fixed version that never reach production.
      - run:
          name: Run npm audit
          command: npm audit --audit-level=high --omit=dev --json | jq -e '.metadata.vulnerabilities.high == 0 and .metadata.vulnerabilities.critical == 0'

  # Job to lint the node project
  lint-node:
    executor: node-prod
    resource_class: small
    # Define the steps to run in this job
    steps:
      - checkout
      - attach-workspace  # Use cached node_modules
      # Run npm lint to check for code style issues
      - run:
          name: Run npm lint
          command: npm run lint

  # Job to check TypeScript types
  typescript-check:
    executor: node-prod
    steps:
      - checkout
      - attach-workspace  # Use cached node_modules
      - run:
          name: Generate Prisma Client
          command: npx prisma generate
      # Run NextJS types generation
      - run:
          name: Run Next Typegen to generate types helper
          command: npx next typegen
      # Run TypeScript type checking
      - run:
          name: Run TypeScript check
          command: npx tsc --noEmit

  # Job to build the node project and store artifacts
  build-node:
    # Build node project
    # Executor to use for the build job, using the same node image as the test job
    executor: node-prod
    # Define the steps to run in this job
    steps:
      # Check out the code from the repository
      - checkout
      - attach-workspace  # Use cached node_modules
      - run:
          name: Generate Prisma Client
          command: npx prisma generate
      # Restaurer le cache du build Next.js
      - restore_cache:
          keys:
            - next-cache-v1-{{ .Branch }}-{{ .Revision }}
            - next-cache-v1-{{ .Branch }}
            - next-cache-v1
      # Run the build command to generate the build artifacts
      - run:
          name: Build Next.js application
          command: npm run build
      # Save the cache for the Next.js build
      - save_cache:
          key: next-cache-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - .next/cache
      # Copy output to artifacts dir
      - run:
          name: Copy necessary artifacts only
          command: |
            mkdir -p ~/artifacts
            cp -R build dist public .output .next .docusaurus ~/artifacts 2>/dev/null || true
      # Store the artifacts in the specified directory
      - store_artifacts:
          path: ~/artifacts
          destination: node-build
      - persist_to_workspace:
          root: .
          paths:
            - .next
            - node_modules

  # Job to check lighthouse scores and store the report in artifacts
  lighthouse-audit:
    # Use the same node image as the test job
    executor: lighthouse-check/default
    # Define the steps to run in this job
    steps:
      - lighthouse-check/audit:
          urls: $LIGHTHOUSE_CHECK_URLS
      - lighthouse-check/validate-status:
          minAccessibilityScore: '60'
          minPerformanceScore: '80'
          minSeoScore: '50'

  # Job to auto merge to the test branch
  auto-merge-to-test:
    # Use the same node image as the test job
    executor: node-prod
    # Define the steps to run in this job
    steps:
      # Check out the code from the repository
      - checkout
      # Add SSH keys for authentication to GitHub
      - add_ssh_keys:
          fingerprints:
            - "SHA256:k3XuzNyv7ANUJUUCVb+Or4RQf7/2Cmto3vui9v0nRGM"
      # Configure git username and email
      - run:
          name: Git config
          command: |
            git config --global user.name "$GITHUB_USER"
            git config --global user.email "$GITHUB_EMAIL"
      - run:
          name: Auto-merge dev into test
          command: |
            git fetch origin test
            git checkout test
            git reset --hard origin/test
            git merge --no-ff -m "Auto-merge from dev to test" dev || echo "Nothing to merge"
            git push origin test

  # Job to create a pull request to the main branch if tests are successful
  create-pr:
    # Use the same node image as the test job
    executor: node-prod
    # Define the steps to run in this job
    steps:
      # Check out the code from the repository
      - checkout
      # Install GitHub CLI
      - run:
          name: Install GitHub CLI
          command: |
            sudo apt update && sudo apt install -y gh
      # Configure git user name and email
      - run:
          name: Git config
          command: |
            git config --global user.name "CircleCI Bot"
            git config --global user.email "bot@circleci.com"
      # Create a pull request to the main branch
      - run:
          name: Create PR to main
          command: |
            gh pr list --base main --head $(git rev-parse --abbrev-ref HEAD) | grep -q . || \
            gh pr create --base main --head $(git rev-parse --abbrev-ref HEAD) --title "Auto-PR from CircleCI" --body "This PR is created automatically by CircleCI after running tests and successfully."

  # Construit la version de production : sortie standalone de Next.js, fichiers statiques et configuration PM2.
  # Le VPS ne compile rien, il reçoit cette archive (deploy/README.md).
  build-release:
    executor: node-prod
    environment:
      # Valeurs figées dans le code par le build, identiques au .env.local du VPS. Les secrets restent sur le serveur.
      # NEXT_PUBLIC_API_URL n'est lu que par les services "use server" : les appels du back-office restent sur la machine.
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuYXBpLmhhcmR3YXJlaG91c2UuZnIk
    steps:
      - checkout
      - attach-workspace  # Use cached node_modules
      - run:
          name: Generate Prisma Client
          command: npx prisma generate
      - restore_cache:
          keys:
            - next-cache-v1-{{ .Branch }}-{{ .Revision }}
            - next-cache-v1-{{ .Branch }}
            - next-cache-v1
      - run:
          name: Build Next.js application
          command: npm run build
      - save_cache:
          key: next-cache-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - .next/cache
      # server.js ne sert public/ et .next/static que s'ils sont copiés à côté de lui
      - run:
          name: Package the release
          command: |
            cp -r public .next/standalone/
            cp -r .next/static .next/standalone/.next/
            cp ecosystem.config.js .next/standalone/
            tar -czf release.tar.gz -C .next/standalone .
            ls -lh release.tar.gz
      - persist_to_workspace:
          root: .
          paths:
            - release.tar.gz

  # Synchronise le schéma MongoDB, puis envoie la version au VPS, qui la teste, la bascule et recharge PM2.
  # La clé SSH de ce job ne peut lancer que deploy/receive-release.sh sur le serveur (command= de authorized_keys).
  deploy-vps:
    executor: node-prod
    resource_class: small
    steps:
      - checkout
      - attach-workspace  # node_modules (CLI Prisma) et release.tar.gz
      - run:
          name: Prisma db push
          command: npx prisma db push
      - add_ssh_keys:
          fingerprints:
            - "SHA256:oTwJw+C9Q0QwoBA+ns9mjiEMjnJuo7i1NmFVf69GEcE"
      # Clé d'hôte du VPS épinglée (deploy/README.md, étape 2) : avec StrictHostKeyChecking=yes, ssh refuse tout
      # serveur qui en présente une autre, quelle que soit la configuration SSH de l'image.
      - run:
          name: Trust the VPS host key
          command: |
            test -n "$VPS_KNOWN_HOSTS" || { echo "Variable VPS_KNOWN_HOSTS absente (deploy/README.md)"; exit 1; }
            install -d -m 700 ~/.ssh
            echo "$VPS_KNOWN_HOSTS" >> ~/.ssh/known_hosts
      - run:
          name: Deploy to the VPS
          command: ssh -o StrictHostKeyChecking=yes -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "deploy $CIRCLE_SHA1" < release.tar.gz

workflows:
  ci-on-dev:
    when:
      equal: [ dev, << pipeline.git.branch >> ]
    jobs:
      - install-dependencies
      - typescript-check:
          requires:
            - install-dependencies
      - lint-node:
          requires:
            - install-dependencies
      - audit-node:
          requires:
            - install-dependencies
      - test-node:
          requires:
            - typescript-check
            - lint-node
      - auto-merge-to-test:
          requires:
            - test-node
            - audit-node

  ci-on-test:
    when:
      equal: [ test, << pipeline.git.branch >> ]
    jobs:
      - install-dependencies
      - audit-node:
          requires:
            - install-dependencies
      - lint-node:
          requires:
            - install-dependencies
      - typescript-check:
          requires:
            - install-dependencies
      - build-node:
          requires:
            - audit-node
            - lint-node
            - typescript-check
      - test-node:
          requires:
            - build-node
      - lighthouse-audit:
          requires:
            - test-node
      - create-pr:
          requires:
            - lighthouse-audit
  # Mêmes contrôles que sur dev et test, puis construction et déploiement sur le VPS
  ci-on-main:
    when:
      equal: [ main, << pipeline.git.branch >> ]
    jobs:
      - install-dependencies
      - typescript-check:
          requires:
            - install-dependencies
      - lint-node:
          requires:
            - install-dependencies
      - audit-node:
          requires:
            - install-dependencies
      - test-node:
          requires:
            - typescript-check
            - lint-node
      - build-release:
          requires:
            - test-node
            - audit-node
      # Un seul déploiement à la fois : celui d'un pipeline plus ancien est sauté si un plus récent attend
      - deploy-vps:
          serial-group: << pipeline.project.slug >>/deploy-vps
          requires:
            - build-release